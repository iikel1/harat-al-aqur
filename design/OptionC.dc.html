<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap">
  <style>
    body { margin: 0; }
    a { color: oklch(0.75 0.13 72); text-decoration: none; }
    a:hover { color: oklch(0.84 0.11 74); }
  </style>
</helmet>

<div dir="rtl" style="width: 880px; height: 1180px; background: oklch(0.20 0.014 62); font-family: 'IBM Plex Sans Arabic', 'Segoe UI', sans-serif; color: oklch(0.93 0.008 80); overflow: hidden; position: relative">

  <!-- the plan is the page -->
  <svg viewBox="0 0 880 820" style="position: absolute; top: 0; right: 0; width: 880px; height: 820px">
    <defs>
      <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
        <path d="M44 0 L0 0 0 44" fill="none" stroke="oklch(0.28 0.014 62)" stroke-width="1"></path>
      </pattern>
    </defs>
    <rect width="880" height="820" fill="url(#grid)"></rect>
    <path d="M120 640 C 250 600, 300 520, 470 500 S 700 440, 820 380" fill="none" stroke="oklch(0.42 0.05 230)" stroke-width="16" opacity="0.35" stroke-linecap="round"></path>
    <polygon points="150,300 300,170 560,150 720,250 740,470 600,610 340,640 170,520"
             fill="oklch(0.72 0.12 70)" opacity="0.07"></polygon>
    <polygon points="150,300 300,170 560,150 720,250 740,470 600,610 340,640 170,520"
             fill="none" stroke="oklch(0.72 0.12 70)" stroke-width="3"></polygon>
    <g fill="oklch(0.20 0.014 62)" stroke="oklch(0.72 0.12 70)" stroke-width="2.6">
      <circle cx="150" cy="300" r="9"></circle><circle cx="300" cy="170" r="9"></circle>
      <circle cx="560" cy="150" r="9"></circle><circle cx="720" cy="250" r="9"></circle>
      <circle cx="740" cy="470" r="9"></circle><circle cx="600" cy="610" r="9"></circle>
      <circle cx="340" cy="640" r="9"></circle><circle cx="170" cy="520" r="9"></circle>
      <circle cx="225" cy="235" r="7"></circle><circle cx="430" cy="160" r="7"></circle>
      <circle cx="640" cy="200" r="7"></circle><circle cx="732" cy="360" r="7"></circle>
      <circle cx="670" cy="540" r="7"></circle><circle cx="470" cy="625" r="7"></circle>
      <circle cx="255" cy="580" r="7"></circle><circle cx="160" cy="410" r="7"></circle>
    </g>
    <!-- gates -->
    <g>
      <rect x="424" y="140" width="18" height="18" transform="rotate(45 433 149)" fill="oklch(0.72 0.12 70)"></rect>
      <rect x="723" y="351" width="18" height="18" transform="rotate(45 732 360)" fill="oklch(0.72 0.12 70)"></rect>
      <rect x="461" y="616" width="18" height="18" transform="rotate(45 470 625)" fill="oklch(0.72 0.12 70)"></rect>
      <rect x="151" y="401" width="18" height="18" transform="rotate(45 160 410)" fill="oklch(0.72 0.12 70)"></rect>
    </g>
    <!-- the one selected pin -->
    <circle cx="150" cy="300" r="20" fill="none" stroke="oklch(0.72 0.12 70)" stroke-width="1.5" opacity="0.5"></circle>
    <circle cx="150" cy="300" r="30" fill="none" stroke="oklch(0.72 0.12 70)" stroke-width="1" opacity="0.25"></circle>
    <text x="176" y="296" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="15" fill="oklch(0.93 0.008 80)">برج المذبحة</text>
    <text x="176" y="316" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="12" fill="oklch(0.66 0.02 72)">الزاوية الشمالية الغربية</text>
  </svg>

  <!-- top chrome over the map -->
  <div style="position: absolute; top: 0; right: 0; left: 0; padding: 20px 32px; display: flex; align-items: center; justify-content: space-between; background: linear-gradient(to bottom, oklch(0.20 0.014 62 / 0.94), transparent)">
    <span style="font-size: 20px; font-weight: 600; letter-spacing: -0.01em">حارة العقر</span>
    <div style="display: flex; gap: 9px; align-items: center">
      <span style="font-size: 12.5px; border: 1px solid oklch(0.72 0.12 70); color: oklch(0.80 0.12 72); padding: 6px 13px; border-radius: 100px">أبراج</span>
      <span style="font-size: 12.5px; border: 1px solid oklch(0.34 0.014 62); color: oklch(0.72 0.012 72); padding: 6px 13px; border-radius: 100px">مساجد</span>
      <span style="font-size: 12.5px; border: 1px solid oklch(0.34 0.014 62); color: oklch(0.72 0.012 72); padding: 6px 13px; border-radius: 100px">أفلاج</span>
      <span style="font-size: 12.5px; border: 1px solid oklch(0.34 0.014 62); color: oklch(0.72 0.012 72); padding: 6px 13px; border-radius: 100px">مقاهٍ ونزل</span>
      <span style="font-size: 12px; color: oklch(0.72 0.012 72); border-inline-start: 1px solid oklch(0.34 0.014 62); padding-inline-start: 14px; margin-inline-start: 5px">EN</span>
    </div>
  </div>

  <!-- bottom sheet -->
  <div style="position: absolute; bottom: 0; right: 0; left: 0; background: oklch(0.24 0.016 62); border-top: 1px solid oklch(0.34 0.014 62); padding: 22px 32px 30px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; justify-content: center"><span style="width: 42px; height: 4px; border-radius: 100px; background: oklch(0.40 0.014 62)"></span></div>
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <span style="font-size: 22px; font-weight: 600">برج المذبحة</span>
      <span style="font-size: 12.5px; color: oklch(0.70 0.012 72)">١ من ١٦ برجاً</span>
    </div>
    <span style="font-size: 14.5px; line-height: 1.95; color: oklch(0.78 0.010 76); max-width: 620px">يقع في الزاوية الشمالية على الجانب الغربي من السور. من عنده تُرى فلج ضوت وامتداد السور نحو السوق.</span>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{near}}" as="n" hint-placeholder-count="3">
        <div style="border: 1px solid oklch(0.32 0.014 62); border-radius: 3px; padding: 14px 15px; display: flex; flex-direction: column; gap: 5px">
          <span style="font-size: 11px; letter-spacing: 0.10em; color: oklch(0.75 0.13 72)">{{n.kind}}</span>
          <span style="font-size: 15px">{{n.title}}</span>
          <span style="font-size: 12px; color: oklch(0.66 0.012 72)">{{n.meta}}</span>
        </div>
      </sc-for>
    </div>
    <div style="display: flex; gap: 11px">
      <span style="background: oklch(0.72 0.12 70); color: oklch(0.20 0.014 62); padding: 12px 24px; font-size: 14px; border-radius: 3px; font-weight: 500">اقرأ المدخل</span>
      <span style="border: 1px solid oklch(0.38 0.014 62); padding: 12px 24px; font-size: 14px; border-radius: 3px">افتح في الخرائط</span>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"accent":{"editor":"color","default":"#c9903f","options":["#c9903f","#c96a4a","#4a8fa8","#9aa84a"],"section":"Theme"}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      near: [
        { kind: 'مسجد', title: 'مسجد الشواذنة', meta: '٩٠ متراً · محراب ٩٣٦هـ' },
        { kind: 'فلج', title: 'فلج ضوت', meta: '١٤٠ متراً · جارٍ' },
        { kind: 'مقهى', title: 'مقيل كافيه', meta: '٢١٠ أمتار · حتى ١٠م' },
      ],
    };
  }
}
</script>
</body>
</html>
